services:
  - type: web
    name: smart-store-harness
    runtime: python
    region: oregon
    plan: starter
    branch: develop
    buildCommand: pip install uv && uv sync --frozen
    # NOTE: alembic upgrade head runs on every start. It is idempotent, so
    # repeated cold-starts are safe. This lives in startCommand rather than
    # preDeployCommand because Render's Starter plan does not execute
    # preDeployCommand. Move it back to preDeployCommand if the service is
    # upgraded to Standard or higher.
    #
    # Blueprint drift: this service was created manually in the dashboard,
    # not provisioned from this file. Changes here do NOT propagate to the
    # running service unless the Blueprint is explicitly synced. Update the
    # matching fields (Start Command, DATABASE_URL) in the dashboard.
    startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: UV_PYTHON_DOWNLOADS
        value: manual
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: smart-store-db
          property: connectionString
      - key: CORS_ORIGINS
        value: ""

databases:
  - name: smart-store-db
    databaseName: smart_store
    plan: starter
    region: oregon
