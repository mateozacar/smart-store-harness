name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Render production deploy
    runs-on: ubuntu-latest
    environment: production          # requires reviewer approval in GitHub repo settings

    steps:
      - name: Deploy to Render
        run: |
          curl --silent --fail --show-error \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            --header "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_PROD }}/deploys"

      - name: Wait for deploy and verify healthz
        run: |
          echo "Waiting for service to come up..."
          for i in $(seq 1 18); do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              "${{ secrets.RENDER_PROD_URL }}/healthz" || true)
            if [ "$status" = "200" ]; then
              echo "Service healthy after $((i * 10))s"
              exit 0
            fi
            echo "Attempt $i: status=$status, retrying in 10s..."
            sleep 10
          done
          echo "Service did not become healthy within 3 minutes" >&2
          exit 1
